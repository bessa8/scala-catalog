name: Vigia
on:
  schedule:
    - cron: '0 6 * * *'   # todos os dias, 06:00 UTC (07:00 em Lisboa no verão)
    - cron: '0 21 * * *'  # segunda leitura diária, 21:00 UTC (o DR publica ao fim do dia)
    - cron: '0 7 * * 1'   # às segundas, 07:00 UTC: a issue semanal
  workflow_dispatch:
    inputs:
      modo:
        description: 'diario ou semanal'
        required: true
        default: diario
permissions:
  contents: write
  issues: write
concurrency:
  group: main
  cancel-in-progress: false
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Modo
        id: modo
        env:
          AGENDA: ${{ github.event.schedule }}
          MODO_PEDIDO: ${{ inputs.modo }}
        run: |
          MODO=diario
          if [ "$AGENDA" = "0 7 * * 1" ]; then MODO=semanal; fi
          if [ -n "$MODO_PEDIDO" ]; then MODO="$MODO_PEDIDO"; fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
      # Só na semanal: a vigia avisa das issues novidade/rever que a rotina não tratou.
      # Uma só listagem (o gh junta com «E» as etiquetas repetidas); a vigia filtra por etiqueta.
      - name: Listar as issues abertas
        if: steps.modo.outputs.modo == 'semanal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --state open --limit 200 --json number,title,createdAt,updatedAt,labels > "$RUNNER_TEMP/abertas.json"
      - name: Ler as fontes
        env:
          MODO: ${{ steps.modo.outputs.modo }}
        run: |
          if [ "$MODO" = "semanal" ]; then
            python3 tools/vigia.py semanal --issues "$RUNNER_TEMP/issues.json" --abertas "$RUNNER_TEMP/abertas.json"
          else
            python3 tools/vigia.py "$MODO" --issues "$RUNNER_TEMP/issues.json"
          fi
      # As issues abrem-se antes de guardar o estado: se falhar, as pistas não se perdem.
      - name: Abrir issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/issues.py "$RUNNER_TEMP/issues.json" --criadas "$RUNNER_TEMP/criadas.json"
      - name: Guardar o estado
        run: |
          git config user.name 'scala-vigia'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/estado.json
          git diff --cached --quiet || git commit -m "Vigia: $(date -u +%F)"
          git push
      # Só depois de guardar o estado: uma falha ao disparar nunca perde o estado (a issue já existe
      # e a vigia semanal avisa se a rotina não a tratar). `!cancelled()` dispara mesmo se o push
      # falhou. Sem ROTINA_URL/ROTINA_TOKEN não faz nada (só abre issues).
      - name: Disparar a rotina
        if: ${{ !cancelled() && steps.modo.outputs.modo == 'semanal' }}
        env:
          ROTINA_URL: ${{ secrets.ROTINA_URL }}
          ROTINA_TOKEN: ${{ secrets.ROTINA_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/disparar.py --criadas "$RUNNER_TEMP/criadas.json"
