name: Validar catálogo
on:
  push:
    branches-ignore: ['claude/**']
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/catalog.py validate
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/catalog.py verify .
